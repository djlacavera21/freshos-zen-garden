name: Deploy Experimentals portal

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage static site
        run: |
          mkdir -p _site
          cp -a experimentals/. _site/
          cp -a catalog _site/catalog
          cp -a visualizer _site/visualizer
          cp docs/EXPERIMENTALS.md docs/FLAVOR-SPEC.md docs/ALIGNMENT.md docs/WHITEPAPER.md _site/ 2>/dev/null || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
